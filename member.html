<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成员档案 - 南开滨海文体部</title>
<style>
:root {
  --bg-1: #fef6ff; --bg-2: #e8f3ff; --primary: #7c57b8;
  --text: #333; --text-light: #666; --card: #fff; --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
  min-height: 100vh; color: var(--text);
}
nav {
  background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(124,87,184,0.08);
}
nav .logo { font-size: 20px; font-weight: 700; color: var(--primary); }
nav .links a { margin-left: 24px; text-decoration: none; color: var(--text-light); font-size: 15px; }
nav .links a:hover, nav .links a.active { color: var(--primary); font-weight: 600; }
.container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
.hero { text-align: center; margin-bottom: 30px; }
.hero h1 { font-size: 28px; color: var(--primary); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: 0 4px 16px rgba(124,87,184,0.08);
}
.card .avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #b088d9);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; margin-bottom: 12px;
}
.card h3 { font-size: 18px; margin-bottom: 4px; }
.card .cls { font-size: 13px; color: #999; margin-bottom: 4px; }
.card .hobby { font-size: 13px; color: var(--text-light); margin-bottom: 14px; }
.bar { margin-bottom: 8px; }
.bar .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); margin-bottom: 3px; }
.bar .track { height: 6px; background: #f0e8f8; border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), #b088d9); border-radius: 3px; transition: width 0.5s; }
.role {
  display: inline-block; margin-top: 12px; padding: 4px 12px;
  border-radius: 20px; font-size: 12px; font-weight: 600;
}
.role.zk { background: #e8f0ff; color: #4a7fd6; }
.role.hd { background: #fff0e8; color: #d67a4a; }
.loading { text-align: center; color: var(--text-light); padding: 40px; }
@media (max-width: 600px) {
  nav { padding: 12px 16px; flex-wrap: wrap; }
  nav .links a { margin-left: 14px; font-size: 14px; }
}
</style>
</head>
<body>
<nav>
  <div class="logo">🎭 文体部</div>
  <div class="links">
    <a href="index.html">首页</a>
    <a href="member.html" class="active">成员档案</a>
    <a href="gallery.html">部门相册</a>
    <a href="log.html">工作日志</a>
  </div>
</nav>
<div class="container">
  <div class="hero"><h1>成员档案</h1></div>
  <div id="memberList" class="loading">加载成员中...</div>
</div>
<script src="config.js"></script>
<script>
function getRole(t, smax) {
  return t >= smax ? { name: '中控', cls: 'zk' } : { name: '后台', cls: 'hd' };
}
async function loadMembers() {
  try {
    const records = await fetchRecords(DINGTALK_CONFIG.bases.members);
    if (records.length === 0) {
      document.getElementById('memberList').innerHTML = '<div class="loading">暂无成员</div>';
      return;
    }
    document.getElementById('memberList').innerHTML = '<div class="grid">' + records.map(r => {
      const t = Number(r['技控']) || 0;
      const smax = Math.max(Number(r['统筹'])||0, Number(r['外联'])||0, Number(r['创想'])||0);
      const role = getRole(t, smax);
      const initial = (r['姓名'] || '?').charAt(0);
      const bar = (label, val) => `<div class="bar">
        <div class="label"><span>${label}</span><span>${val}/5</span></div>
        <div class="track"><div class="fill" style="width:${(val/5)*100}%"></div></div>
      </div>`;
      return `<div class="card">
        <div class="avatar">${initial}</div>
        <h3>${r['姓名'] || ''}</h3>
        <div class="cls">${r['班级'] || ''}</div>
        <div class="hobby">爱好：${r['爱好'] || ''}</div>
        ${bar('技控', t)}
        ${bar('统筹', r['统筹']||0)}
        ${bar('外联', r['外联']||0)}
        ${bar('创想', r['创想']||0)}
        <span class="role ${role.cls}">${role.name}</span>
      </div>`;
    }).join('') + '</div>';
  } catch (e) {
    document.getElementById('memberList').innerHTML = '<div class="loading">加载失败</div>';
  }
}
loadMembers();
</script>
</body>
</html>

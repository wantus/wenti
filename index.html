<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南开滨海文体部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12121e;
  --bg-card: rgba(30,30,50,0.85);
  --primary: #b8a5e0;
  --primary-light: #9d8fc4;
  --accent: #6b5b8e;
  --text: #e8e8f0;
  --text-light: #9a9ab0;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-hover: 0 8px 32px rgba(0,0,0,0.4);
  --radius: 20px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background-color: #1a1a2e;
  background: linear-gradient(90deg, #2a1a3a 0%, #1a1a2e 50%, #1a2030 100%);
  background-size: 200% 200%;
  animation: wave 8s ease-in-out infinite;
  min-height: 100vh;
  color: var(--text);
  line-height: 1.6;
  position: relative;
  overflow-x: hidden;
}
@keyframes wave {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
nav {
  background: linear-gradient(135deg, 
    rgba(255,255,255,0.08) 0%, 
    rgba(184,165,224,0.06) 50%, 
    rgba(255,255,255,0.04) 100%);
  backdrop-filter: blur(40px) saturate(180%) brightness(1.1);
  -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.1);
  padding: 12px 24px;
  margin: 16px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 16px;
  z-index: 100;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.2),
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(255,255,255,0.05);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
nav .brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
nav .brand img {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  object-fit: cover;
  box-shadow: 0 0 16px rgba(184,165,224,0.2);
}
nav .brand span {
  font-size: 17px;
  font-weight: 600;
  background: linear-gradient(135deg, #d4c5f0, #9d8fc4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}
nav .links { display: flex; gap: 4px; }
nav .links a {
  text-decoration: none;
  color: var(--text-light);
  font-size: 14px;
  font-weight: 500;
  padding: 8px 18px;
  border-radius: 100px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
nav .links a:hover { 
  color: var(--primary); 
  background: rgba(184,165,224,0.08);
  transform: translateY(-1px);
}
nav .links a.active {
  color: #fff;
  background: linear-gradient(135deg, #9d8fc4, #7b6ba8);
  box-shadow: 0 4px 20px rgba(157,143,196,0.35);
}
.container { max-width: 800px; margin: 0 auto; padding: 60px 24px; }
.hero {
  text-align: center;
  margin-bottom: 56px;
}
.hero .crest {
  width: 100px;
  height: 100px;
  border-radius: 24px;
  margin: 0 auto 24px;
  display: block;
  box-shadow: 0 8px 32px rgba(107,91,142,0.15);
}
.hero .tag {
  display: inline-block;
  font-size: 12px;
  color: var(--primary);
  background: rgba(107,91,142,0.08);
  padding: 6px 16px;
  border-radius: 100px;
  margin-bottom: 16px;
  letter-spacing: 1px;
  font-weight: 500;
}
.hero h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 56px;
  font-weight: 900;
  background: linear-gradient(180deg, #e8dff5 0%, #d4c5f0 50%, #b8a5e0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  letter-spacing: 12px;
  animation: titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% {
    filter: drop-shadow(0 2px 12px rgba(212,197,240,0.3));
    opacity: 0.9;
  }
  50% {
    filter: drop-shadow(0 2px 30px rgba(232,223,245,0.8));
    opacity: 1;
  }
}
#typewriter {
  color: #d4c5f0;
}
.hero p {
  color: var(--primary-light);
  font-size: 15px;
  font-weight: 400;
  max-width: 500px;
  margin: 0 auto;
  line-height: 1.8;
}
.hero p {
  color: var(--text-light);
  font-size: 16px;
  font-weight: 400;
}
.features {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin: 40px 0;
}
.feature-card {
  background: var(--bg-card);
  border: 1px solid rgba(184,165,224,0.1);
  border-radius: 16px;
  padding: 32px;
  text-align: left;
  transition: all 0.3s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  min-height: 120px;
}
.feature-content {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  align-items: center;
}
.feature-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(135deg, #e8dff5, #9d8fc4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.flip-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
  perspective: 1200px;
}
.flip-overlay.show {
  opacity: 1;
  visibility: visible;
}
.flip-modal {
  background: rgba(30,30,50,0.95);
  border: 1px solid rgba(184,165,224,0.2);
  border-radius: 24px;
  padding: 40px;
  max-width: 420px;
  width: 90%;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
  transform: rotateY(90deg) scale(0.8);
  opacity: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
}
.flip-modal-bg {
  position: absolute;
  right: -15px;
  bottom: -15px;
  width: 140px;
  height: 140px;
  object-fit: contain;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.flip-overlay.show .flip-modal-bg {
  opacity: 0.15;
  transition-delay: 1s;
}
.flip-overlay.show .flip-modal {
  transform: rotateY(0deg) scale(1);
  opacity: 1;
}
.flip-close {
  position: absolute;
  top: 16px;
  right: 20px;
  font-size: 24px;
  color: var(--text-light);
  cursor: pointer;
  transition: color 0.2s;
}
.flip-close:hover {
  color: var(--primary);
}
.flip-modal-inner h3 {
  color: var(--primary);
  font-size: 28px;
  margin-bottom: 16px;
  font-family: 'Noto Serif SC', serif;
}
.flip-modal-inner p {
  color: var(--text-light);
  line-height: 1.8;
  font-size: 15px;
  margin-bottom: 12px;
}
.feature-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(184,165,224,0.15);
  border-color: rgba(184,165,224,0.25);
}
.feature-icon {
  font-size: 32px;
  margin-bottom: 12px;
}
.feature-card h4 {
  color: var(--primary);
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}
.feature-big {
  font-family: 'Noto Serif SC', serif;
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(135deg, #e8dff5, #9d8fc4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  cursor: pointer;
  transition: transform 0.3s ease;
}
.feature-big:hover {
  transform: scale(1.05);
}
.feature-card p {
  color: var(--text-light);
  font-size: 13px;
  line-height: 1.5;
}
.spirit {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin: 40px 0;
  padding: 24px;
  background: var(--bg-card);
  border: 1px solid rgba(184,165,224,0.08);
  border-radius: 20px;
}
.spirit-item {
  text-align: center;
}
.spirit-char {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, #d4c5f0, #9d8fc4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.spirit-name {
  color: var(--text-light);
  font-size: 13px;
  letter-spacing: 2px;
}
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.modal.show {
  display: flex;
}
.modal-content {
  background: rgba(30,30,50,0.95);
  border: 1px solid rgba(184,165,224,0.2);
  border-radius: 20px;
  padding: 40px;
  max-width: 400px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  position: relative;
}
@keyframes flipIn {
  0% {
    transform: perspective(600px) rotateY(90deg) scale(0.9);
    opacity: 0;
  }
  100% {
    transform: perspective(600px) rotateY(0deg) scale(1);
    opacity: 1;
  }
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 20px;
  font-size: 24px;
  color: var(--text-light);
  cursor: pointer;
  transition: color 0.2s;
}
.modal-close:hover {
  color: var(--primary);
}
.modal-content h3 {
  color: var(--primary);
  font-size: 24px;
  margin-bottom: 16px;
  font-family: 'Noto Serif SC', serif;
}
.modal-content p {
  color: var(--text-light);
  line-height: 1.8;
  font-size: 15px;
}
.events {
  margin: 40px 0;
  padding: 32px;
  background: var(--bg-card);
  border: 1px solid rgba(184,165,224,0.08);
  border-radius: 20px;
}
.events-title {
  color: var(--primary);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  text-align: center;
}
.event-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(184,165,224,0.08);
}
.event-item:last-child {
  border-bottom: none;
}
.event-date {
  color: var(--primary);
  font-size: 14px;
  font-weight: 600;
  min-width: 50px;
}
.event-text {
  color: var(--text-light);
  font-size: 14px;
}
.card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,0.6);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}
.card .date {
  font-size: 13px;
  color: var(--primary-light);
  font-weight: 500;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}
.card h3 {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
  letter-spacing: -0.2px;
}
.card .content {
  color: var(--text-light);
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-line;
}
.loading {
  text-align: center;
  color: var(--text-light);
  padding: 60px;
  font-size: 14px;
}

.deco {
  position: fixed;
  opacity: 0.5;
  pointer-events: none;
  z-index: 1;
}
.deco.pig {
  bottom: 20px;
  left: 20px;
  width: 80px;
}
.deco.pony {
  bottom: 20px;
  right: 20px;
  width: 90px;
}
@media (max-width: 600px) {
  nav { padding: 12px 20px; }
  nav .links a { padding: 6px 12px; font-size: 13px; }
  .container { padding: 40px 16px; }
  .hero h1 { font-size: 28px; }
  .card { padding: 24px; }
}

/* 入场动画 */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
nav { animation: fadeInDown 0.6s ease-out both; }
.hero h1 { animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both; }
.hero p { animation: fadeInUp 0.6s ease-out 0.5s both; }
.card { animation: fadeInUp 0.5s ease-out both; }
.card:nth-child(1) { animation-delay: 0.6s; }
.card:nth-child(2) { animation-delay: 0.75s; }
.card:nth-child(3) { animation-delay: 0.9s; }
.card:nth-child(4) { animation-delay: 1.05s; }
.card:nth-child(5) { animation-delay: 1.2s; }
.card:nth-child(6) { animation-delay: 1.35s; }
</style>
</head>
<body>
<nav>
  <div class="brand">
    <img src="https://aka.doubaocdn.com/s/EDVt2xF5Zr" alt="部徽">
    <span>文体部</span>
  </div>
  <div class="links">
    <a href="index.html" class="active">首页</a>
    <a href="member.html">成员</a>
    <a href="gallery.html">相册</a>
    <a href="log.html">日志</a>
    <a href="message.html">留言板</a>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <!-- 打字机转场 -->
    <div id="typewriter" style="
      font-family:'Noto Serif SC',serif;
      font-size:40px;
      font-weight:700;
      color:#7b6bb0;
      min-height:64px;
      margin-bottom:16px;
      letter-spacing:8px;
      transition:all 0.3s ease;
    ">
      <span id="typeText"></span><span style="display:inline-block;width:3px;background:#9d8fc4;animation:blink 1s infinite;margin-left:4px;">&nbsp;</span>
    </div>
    
    <p id="greeting"></p>
  </div>

  <!-- 部门特色 -->
  <div class="features">
    <div class="feature-card" onclick="flipExpand('wen')">
      <div class="feature-content">
        <div class="feature-label">文</div>
      </div>
    </div>
    <div class="feature-card" onclick="flipExpand('ti')">
      <div class="feature-content">
        <div class="feature-label">体</div>
      </div>
    </div>
  </div>

  <!-- 3D翻转遮罩 -->
  <div id="flipOverlay" class="flip-overlay" onclick="flipClose()">
    <div class="flip-modal" id="flipModal">
      <span class="flip-close" onclick="flipClose()">&times;</span>
      <img id="flipModalBg" class="flip-modal-bg" alt="">
      <div class="flip-modal-inner">
        <h3 id="flipModalTitle"></h3>
        <p id="flipModalText"></p>
      </div>
    </div>
  </div>

  <!-- 部门精神 -->
  <div class="spirit">
    <div class="spirit-item">
      <div class="spirit-char">明</div>
      <div class="spirit-name">明学</div>
    </div>
    <div class="spirit-item">
      <div class="spirit-char">理</div>
      <div class="spirit-name">理性</div>
    </div>
    <div class="spirit-item">
      <div class="spirit-char">敬</div>
      <div class="spirit-name">敬业</div>
    </div>
    <div class="spirit-item">
      <div class="spirit-char">爱</div>
      <div class="spirit-name">仁爱</div>
    </div>
  </div>
  
  <div id="noticeList" class="loading">加载中...</div>
</div>
<script src="config.js"></script>
<script src="particles.js"></script>
<script>
// 打字机转场动画
(function() {
  const typeText = document.getElementById('typeText');
  
  // 根据时间判断问候语
  const hour = new Date().getHours();
  let timeGreeting = '晚上好';
  if (hour >= 6 && hour < 12) timeGreeting = '早上好';
  else if (hour >= 12 && hour < 18) timeGreeting = '下午好';
  
  // 节日判断
  const now = new Date();
  const month = now.getMonth() + 1;
  const date = now.getDate();
  let festivalGreeting = null;
  
  if (month === 1 && date === 1) festivalGreeting = '新年快乐';
  else if (month === 1 && date === 15) festivalGreeting = '元宵节快乐';
  else if (month === 2 && date === 14) festivalGreeting = '情人节快乐';
  else if (month === 5 && date === 1) festivalGreeting = '劳动节快乐';
  else if (month === 6 && date === 1) festivalGreeting = '儿童节快乐';
  else if (month === 9 && date === 10) festivalGreeting = '教师节快乐';
  else if (month === 10 && date === 1) festivalGreeting = '国庆节快乐';
  
  // 文言句子库（秋绥冬禧概率更大）
  const classicalQuotes = [
    '乐与泪同',
    '文以载道',
    '体以凝心',
    '以文会友',
    '秋绥冬禧',
    '秋绥冬禧',
    '秋绥冬禧'
  ];
  
  const greetingText = (festivalGreeting || timeGreeting) + '，' + classicalQuotes[Math.floor(Math.random() * classicalQuotes.length)];
  const mainTitle = '第十届文体部';
  
  // 第一步：打字打出问候语
  let i = 0;
  function typeGreeting() {
    if (i < greetingText.length) {
      typeText.textContent += greetingText.charAt(i);
      i++;
      setTimeout(typeGreeting, 150);
    } else {
      // 打完后停留1.5秒，然后开始删除
      setTimeout(eraseGreeting, 1500);
    }
  }
  
  // 第二步：删除问候语
  function eraseGreeting() {
    if (typeText.textContent.length > 0) {
      typeText.textContent = typeText.textContent.slice(0, -1);
      setTimeout(eraseGreeting, 80);
    } else {
      // 删完后开始打大标题
      setTimeout(typeTitle, 300);
    }
  }
  
  // 第三步：打出大标题
  let j = 0;
  function typeTitle() {
    if (j < mainTitle.length) {
      typeText.textContent += mainTitle.charAt(j);
      j++;
      setTimeout(typeTitle, 200);
    }
  }
  
  typeGreeting();
})();

// 打字机闪烁动画
const blinkStyle = document.createElement('style');
blinkStyle.textContent = `
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
`;
document.head.appendChild(blinkStyle);

// 随机问候语（每次刷新显示不同）
const greetings = [
  '乐与泪都是青春的馈赠，好在我们都在彼此身边',
  '遇见你们，是我青春里最盛大的幸运',
  '一个人可以走得很快，但一群人可以走得很远',
  '最珍贵的是遇见，最难得的是重逢',
  '不是我，是我们，无数个 i 凝聚成团结的集体',
  '我不是一个人在战斗，我们都在',
  '一个微笑，一个笑容，便是乐',
  '以感恩与包容之心，共赴乐与泪的相逢',
  '文体的 i，是热爱，是团结，是我们',
  '一滴泪是一个人的动容，无数泪是一群人的青春'
];
document.getElementById('greeting').textContent = greetings[Math.floor(Math.random() * greetings.length)];

// 3D翻转展开
function flipExpand(type) {
  const overlay = document.getElementById('flipOverlay');
  const title = document.getElementById('flipModalTitle');
  const text = document.getElementById('flipModalText');
  const bg = document.getElementById('flipModalBg');
  if (type === 'wen') {
    title.textContent = '文';
    text.innerHTML = '承办礼堂大部分活动，负责电脑控制、灯光操纵、音频调节、后台管理，用技术为舞台保驾护航：<br><br>元旦晚会、海棠节、舞蹈节、青莲杯、南开好声音、话剧节、中秋晚会、合唱节';
    bg.src = 'https://aka.doubaocdn.com/s/70MCX4m6ch';
  } else {
    title.textContent = '体';
    text.innerHTML = '举办重大体育赛事，组织运动竞技，强健学生体魄，用运动点燃青春：<br><br>运动会、三六杯、五虎杯';
    bg.src = 'https://aka.doubaocdn.com/s/TPilbySQ49';
  }
  overlay.classList.add('show');
}
function flipClose() {
  document.getElementById('flipOverlay').classList.remove('show');
}

async function loadNotices() {
  try {
    const records = await fetchRecords(DINGTALK_CONFIG.bases.notice);
    const visible = records.filter(r => r['是否显示'] === true);
    visible.sort((a, b) => (Number(a['排序']) || 0) - (Number(b['排序']) || 0));
    if (visible.length === 0) {
      document.getElementById('noticeList').innerHTML = '<div class="loading">暂无公告</div>';
      return;
    }
    document.getElementById('noticeList').innerHTML = visible.map(r => {
      const d = new Date(r['发布日期']);
      const ds = d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
      return `<div class="card">
        <div class="date">${ds}</div>
        <h3>${r['标题'] || ''}</h3>
        <div class="content">${r['内容'] || ''}</div>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('noticeList').innerHTML = '<div class="loading">加载失败</div>';
  }
}
loadNotices();

// 点击彩蛋：随机蹦出小星星
document.addEventListener('click', (e) => {
  const star = document.createElement('div');
  star.textContent = '✦';
  star.style.cssText = `
    position: fixed;
    left: ${e.clientX - 15}px;
    top: ${e.clientY - 15}px;
    font-size: ${20 + Math.random() * 20}px;
    color: #b8a5d9;
    pointer-events: none;
    z-index: 9999;
    animation: floatUp 1s ease-out forwards;
  `;
  document.body.appendChild(star);
  setTimeout(() => star.remove(), 1000);
});
// 注入动画样式
const style = document.createElement('style');
style.textContent = `@keyframes floatUp {
  0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-80px) scale(0.5) rotate(180deg); opacity: 0; }
}`;
document.head.appendChild(style);
</script>
